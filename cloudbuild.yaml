# Builds backend/Dockerfile with the repository root as context and pushes it to Artifact Registry.
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/api:TAG
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
